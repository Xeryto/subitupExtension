name: Notify privacy policy change

on:
  push:
    branches: [master]
    paths: ['PRIVACY.md']

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to PersonalSite
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.PERSONALSITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Xeryto/PersonalSite/dispatches \
            -d '{"event_type":"privacy-updated"}'
